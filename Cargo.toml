[package]
name = "asm-bypass"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "native-tls"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
ctrlc = "3"
libc = "0.2"
flate2 = "1"
quick-xml = { version = "0.31", features = ["serialize"] }
fastrand = "2"

[profile.release]
opt-level = 2
strip = true
